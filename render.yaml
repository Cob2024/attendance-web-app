services:
  - type: web
    name: smartattend-api
    runtime: node
    rootDir: server
    buildCommand: npm install && npx prisma generate && npx prisma db push --accept-data-loss && npm run db:seed && npm run build
    startCommand: npm start
    plan: free
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: 'https://attendance-web-app-lac.vercel.app'
      - key: DATABASE_URL
        sync: false  # Configure in Render Dashboard with your Supabase PostgreSQL URI
      - key: ADMIN_PASSWORD
        value: admin123

